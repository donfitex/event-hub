{% extends 'base.html' %}{% block content %}<h1>{{ event.title }}</h1><h2>Attendees</h2><form class="search"><input name="q" value="{{ request.GET.q }}" placeholder="Search email" aria-label="Search email"><button>Search</button><button name="export" value="csv">Export CSV</button></form><div class="table-scroll"><table><thead><tr><th>Email</th><th>Status</th><th>Registered</th></tr></thead><tbody>{% for r in page %}<tr><td>{{ r.user.email }}</td><td>{{ r.get_status_display }}</td><td>{{ r.registered_at }}</td></tr>{% empty %}<tr><td colspan="3">No attendees yet.</td></tr>{% endfor %}</tbody></table></div>{% include 'pagination.html' %}{% endblock %}
