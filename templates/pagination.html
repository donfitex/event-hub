{% if page.has_other_pages %}<nav class="pagination" aria-label="Pagination">{% if page.has_previous %}<a href="?q={{ request.GET.q|urlencode }}&category={{ request.GET.category|urlencode }}&page={{ page.previous_page_number }}">← Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?q={{ request.GET.q|urlencode }}&category={{ request.GET.category|urlencode }}&page={{ page.next_page_number }}">Next →</a>{% endif %}</nav>{% endif %}
