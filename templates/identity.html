{% extends 'base.html' %}{% load static %}{% block content %}<section class="form-panel" id="identity" data-mode="{{ mode }}" data-next="{{ next }}" data-base="{{ request.scheme }}://{{ request.get_host }}/identity/neon"><p class="eyebrow">WELCOME TO EVENTHUB</p><h1 id="auth-title">Your next experience starts here.</h1><p id="auth-status" role="status" aria-live="polite"></p><form id="auth-form">{% csrf_token %}<p id="name-field"><label for="auth-name">Your name</label><input id="auth-name" name="name" autocomplete="name"></p><p><label for="auth-email">Email</label><input id="auth-email" name="email" type="email" required autocomplete="email"></p><p><label for="auth-password">Password</label><input id="auth-password" name="password" type="password" minlength="10" required autocomplete="current-password"></p><button type="submit">Continue ↗</button></form><p><a href="?mode=signup">Create account</a> · <a href="?mode=login">Log in</a> · <a href="?mode=reset">Reset password</a></p></section><script type="module" src="{% static 'js/auth.js' %}"></script>{% endblock %}
