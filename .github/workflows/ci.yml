name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eventhub
          POSTGRES_USER: eventhub
          POSTGRES_PASSWORD: test-password
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U eventhub" --health-interval 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.testing
      TEST_POSTGRES: '1'
      DB_NAME: eventhub
      DB_USER: eventhub
      DB_PASSWORD: test-password
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py spectacular --file openapi.yaml --validate --fail-on-warn
      - run: pytest --cov=apps --cov-report=term-missing --cov-report=xml
      - run: python manage.py collectstatic --noinput
      - run: docker build -t eventhub .
